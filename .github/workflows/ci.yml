name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  deps-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate

      # A separate job, not a step in `quality`, so a newly-published advisory
      # never blocks lint/typecheck/test feedback on an unrelated PR. Genuinely
      # gating: no `continue-on-error`, no `|| true`. An advisory with no fix
      # available yet is triaged into `pnpm.auditConfig.ignoreCves` /
      # `ignoreGhsas` in package.json, each entry mirrored by a row in
      # docs/milestones/15-audit/dependency-triage.md — a reviewed, committed
      # decision rather than a disabled gate. `--prod` is deliberate: a
      # devDependency advisory (a test runner, a build tool) does not ship to
      # a client deployment and should not hold a release.
      - name: pnpm audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

  db-migrations:
    name: Database migrations & schema tests
    runs-on: ubuntu-latest
    # Gate on `quality` so a migration/integration run does not spend CI
    # minutes on a branch that does not lint or typecheck. Milestone 15 audit
    # finding 6: this job previously ran regardless.
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies migrations + seed)
        run: pnpm exec supabase start

      - name: Verify migrations + seed are idempotent
        # `supabase start` already applied migrations + seed once; one more
        # `db reset` applies them a second time. Two applications is the whole
        # proof that seed.sql's `on conflict do nothing` is genuinely
        # idempotent — a third full apply (the previous double reset) cost
        # ~1-2 min and proved nothing extra. See
        # docs/architecture/database-conventions.md.
        run: pnpm exec supabase db reset

      - name: Export local Supabase URL/keys for the integration tests
        # `-o env` writes dotenv-quoted `KEY="value"` lines, which
        # $GITHUB_ENV does not unquote on a plain `>>` append — every
        # exported value would end up with literal quote characters baked
        # in (e.g. supabase-js rejecting `"http://127.0.0.1:54321"` as an
        # invalid URL). `-o json` + jq gives us the raw values so we control
        # the exact unquoted `KEY=value` lines written to $GITHUB_ENV.
        run: |
          status=$(pnpm exec supabase status -o json)
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Check required Supabase Auth secrets are present (values never printed)
        run: |
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not set for the integration test run"
              exit 1
            fi
          done

      - name: Run schema/constraint/seed/auth/RLS integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Milestone 14 gave this job a database for the first time. Before it,
      # every E2E spec was public or an unauthenticated-redirect assertion,
      # because the authenticated POS/checkout coverage this milestone's
      # Testing Requirements call for has nothing to sign into without one.
      - name: Start local Supabase (applies migrations + seed)
        run: pnpm exec supabase start

      - name: Export local Supabase URL/anon key for the E2E run
        # Same `-o json` + jq reasoning as the db-migrations job above:
        # `-o env` writes dotenv-quoted values that $GITHUB_ENV does not
        # unquote. Only the anon key is exported — tests/e2e/helpers/seed.ts
        # seeds through the owner's own authenticated client, never the
        # service-role key, so this job never needs that secret at all.
        run: |
          status=$(pnpm exec supabase status -o json)
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"

      - name: Check required Supabase env is present (values never printed)
        run: |
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not set for the E2E run"
              exit 1
            fi
          done

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The Supabase env exported above must already be set here: Playwright's
      # webServer runs `pnpm build`, and NEXT_PUBLIC_* are inlined into the
      # client bundle at build time.
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop
