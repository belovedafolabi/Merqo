# Single-package workspace. Per Milestone 01 Implementation Notes: do not
# pre-build a monorepo speculatively. To add a package later, list its path here.
packages: []

minimumReleaseAgeExclude:
  - '@next/env@16.3.2'
  - '@next/eslint-plugin-next@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - eslint-config-next@16.3.2
  - eslint@10.9.0
  - next@16.3.2

# pnpm 10+ blocks dependency build scripts by default. These genuinely need to
# run — omitting any of them produces a broken install with no error.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - supabase
  - unrs-resolver

# Security overrides for transitive dependencies flagged by Dependabot.
# ansi-regex@5.0.0 (pulled in by pretty-format, via @testing-library/dom):
# GHSA-93q8-gq69-wqmw, ReDoS, fixed in 5.0.1. Dev-only dependency chain
# (test tooling, never shipped), but trivial to pin correctly.
#
# uuid <11.1.1 (pulled in by exceljs, added in Milestone 10 for Excel export):
# GHSA-2825-h4q3-27g9, missing buffer bounds check in v3/v5/v6 when a `buf`
# argument is supplied. exceljs only ever calls `v4()` with no arguments
# (lib/xlsx/xform/sheet/cf-ext/cf-rule-ext-xform.js), so the vulnerable path is
# unreachable through this project — but "unreachable today" is a property of
# exceljs's internals, not a guarantee, and pinning costs nothing.
overrides:
  ansi-regex@5.0.0: '5.0.1'
  uuid@8.3.2: '^11.1.1'
