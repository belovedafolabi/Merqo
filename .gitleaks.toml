title = "Merqo gitleaks configuration"

[extend]
useDefault = true

# Global allowlist, applied across all rules (gitleaks v8 schema: a single
# top-level [allowlist] table, not an array — an earlier [[allowlists]] array
# here silently did nothing and let a documented .env.example placeholder
# trip the default stripe-access-token rule).
[allowlist]
description = "Documented placeholder values and the design corpus's illustrative examples"
paths = [
  '''^\.env\.example$''',
  '''^docs/''',
]
# The two well-known, public "demo" JWTs every local Supabase CLI project
# ships (same anon/service_role keys `supabase start` prints for every
# developer, everywhere — see the Supabase CLI/quickstart docs). Used only
# as a fallback default in tests/integration/helpers/supabase.ts for a
# zero-setup `pnpm test:integration` against the local instance; CI always
# overrides them with the real values `supabase status -o env` exports.
# Matched by exact string, not by file path, so a real secret added to that
# same file later would still be caught.
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9\.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0\.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU''',
]
